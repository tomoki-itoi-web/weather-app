<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>天気アプリ</title>
    <style>
        .weather-card { padding: 20px; border: 1px solid #ccc; border-radius: 10px; width: 200px; }
    </style>
</head>
<body>
    <div class="weather-card" id="weather">位置情報を取得中...</div>

    <script>
        // 天気コードに応じたメッセージを返す関数
        function getWeatherDescription(code) {
            const descriptions = { 0: "快晴 ☀️", 1: "晴れ 🌤️", 2: "曇り ☁️", 3: "雨 🌧️" };
            return descriptions[code] || "データ取得中...";
        }

        navigator.geolocation.getCurrentPosition(async (position) => {
            const { latitude, longitude } = position.coords;
            const url = `https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,weather_code&timezone=Asia/Tokyo`;

            const res = await fetch(url);
            const data = await res.json();
            
            const temp = data.current.temperature_2m;
            const desc = getWeatherDescription(data.current.weather_code);

            document.getElementById('weather').innerHTML = `<h3>現在の天気</h3><p>${desc}</p><p>気温: ${temp}°C</p>`;
        });
    </script>
</body>
</html>
